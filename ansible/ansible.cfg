[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = collections
interpreter_python   = auto_silent
host_key_checking    = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks
retry_files_enabled  = False
forks                = 10
fact_caching         = jsonfile
fact_caching_connection = facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# ControlPersist mantem a conexao aberta entre tasks; o host de aplicacao e
# alcancado por dentro do tunel e reconectar a cada task e caro.
ssh_args        = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
pipelining      = True
control_path    = /tmp/ansible-ssh-%%h-%%p-%%r
