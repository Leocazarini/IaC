name: iac-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: iac-dev:latest
    container_name: iac-dev
    hostname: iac-dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: sleep infinity
    environment:
      TZ: America/Sao_Paulo
      AWS_PROFILE: ${AWS_PROFILE:-default}
      # Apenas nome e e-mail de autoria, lidos do host pelo script `dev`.
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      # O repositório é o único caminho do host visível dentro do container.
      - ..:/workspace

      # Estado do container, preservado entre recriações e reconstruções da
      # imagem. Nenhum destes volumes tem correspondência no host.
      - ssh-keys:/home/dev/.ssh
      - aws-config:/home/dev/.aws
      - claude-state:/home/dev/.claude
      - shell-history:/commandhistory
      - terraform-plugin-cache:/home/dev/.terraform.d/plugin-cache

volumes:
  ssh-keys:
  aws-config:
  claude-state:
  shell-history:
  terraform-plugin-cache:
