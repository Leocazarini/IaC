name: iac-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: iac-dev:latest
    container_name: iac-dev
    hostname: iac-dev
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: sleep infinity
    environment:
      TZ: America/Sao_Paulo
      AWS_PROFILE: ${AWS_PROFILE:-default}
    volumes:
      # O repositório. É o único caminho compartilhado com o host por padrão.
      - ..:/workspace

      # Credenciais e identidade do host.
      # Leitura e escrita em .aws para permitir `aws configure` e cache de SSO.
      - ${HOME}/.aws:/home/dev/.aws
      - ${HOME}/.ssh:/home/dev/.ssh:ro
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro

      # Estado do container, preservado entre recriações.
      - claude-state:/home/dev/.claude
      - shell-history:/commandhistory
      - terraform-plugin-cache:/home/dev/.terraform.d/plugin-cache

      # Login do Claude Code reaproveitado do host. Descomente para não precisar
      # autenticar de novo dentro do container.
      # - ${HOME}/.claude/.credentials.json:/home/dev/.claude/.credentials.json

      # Docker do host, para testar roles com molecule. Concede ao container
      # controle total sobre o Docker do host — manter desligado sem necessidade.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  claude-state:
  shell-history:
  terraform-plugin-cache:
